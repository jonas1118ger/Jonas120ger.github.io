<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍺 Bierkarten</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h1>🍺 Bierkarten</h1>

    <button
        class="settingsButton"
        onclick="toggleSettings()"
        aria-label="Einstellungen">
        ⚙️
    </button>

</header>


<main>

    <!-- Kartenstapel -->

    <div id="deck" class="deck">

        <div class="deckCard deckBack">
            🍺
        </div>

        <div class="deckCard deckMiddle"></div>

        <div class="deckCard deckTop">
            🍺
        </div>

    </div>


    <div id="deckInfo" class="deckInfo">
        0 Karten
    </div>


    <button
        id="drawButton"
        class="drawButton">

        Karte ziehen

    </button>


    <!-- Kategorie beim Spielen auswählen -->

    <div class="categoryFilter">

        <label for="categoryFilter">
            Kategorie:
        </label>

        <select id="categoryFilter"></select>

    </div>


    <!-- Gezogene Karte -->

    <div id="cardContainer"></div>

</main>



<!-- =====================================================
     EINSTELLUNGEN
===================================================== -->

<div
    id="settingsOverlay"
    class="overlay"
    onclick="closeSettingsOnOverlay(event)">


    <div
        class="settingsWindow"
        onclick="event.stopPropagation()">


        <div class="settingsHeader">

            <h2>⚙️ Einstellungen</h2>

            <button
                class="closeButton"
                onclick="toggleSettings()">

                ✖

            </button>

        </div>


        <hr>


        <!-- =================================================
             KARTEN
        ================================================== -->

        <h3>📄 Karten</h3>


        <input
            id="searchInput"
            class="searchInput"
            type="search"
            placeholder="🔎 Karten suchen..."
            oninput="refreshCardList()">


        <select id="cardSelect"></select>


        <button onclick="loadSelectedCard()">
            📄 Karte laden
        </button>


        <button onclick="newCard()">
            ➕ Neue Karte
        </button>


        <button onclick="duplicateCard()">
            📋 Karte duplizieren
        </button>


        <hr>


        <label for="titleInput">
            Titel
        </label>


        <input
            id="titleInput"
            type="text"
            placeholder="Kartentitel">


        <label for="textInput">
            Kartentext
        </label>


        <textarea
            id="textInput"
            rows="6"
            placeholder="Kartentext eingeben..."></textarea>


        <small class="hint">

            Zufallszahlen:

            <b>{1-9}</b>,
            <b>{5-20}</b>,
            <b>{100-500}</b>

        </small>


        <!-- Kategorie -->

        <label for="categoryInput">
            Kategorie
        </label>


        <select id="categoryInput"></select>


        <!-- Eigene Farbe -->

        <label class="checkboxLabel">

            <input
                type="checkbox"
                id="customColorInput">

            Eigene Kartenfarbe verwenden

        </label>


        <input
            id="colorInput"
            type="color"
            value="#ffffff">


        <small class="hint">

            Wenn diese Option deaktiviert ist,
            verwendet die Karte automatisch
            die Farbe ihrer Kategorie.

        </small>


        <button onclick="saveCard()">
            💾 Karte speichern
        </button>


        <button onclick="duplicateCard()">
            📋 Karte duplizieren
        </button>


        <button
            class="deleteButton"
            onclick="deleteCard()">

            🗑️ Karte löschen

        </button>



        <!-- =================================================
             KATEGORIEN
        ================================================== -->

        <hr>

        <h3>🏷️ Kategorien</h3>


        <select
            id="categoryManagerSelect">
        </select>


        <button onclick="loadSelectedCategory()">
            ✏️ Kategorie bearbeiten
        </button>


        <button onclick="newCategory()">
            ➕ Neue Kategorie
        </button>


        <hr>


        <label for="categoryNameInput">
            Kategoriename
        </label>


        <input
            id="categoryNameInput"
            type="text"
            placeholder="z. B. Trinken">


        <label for="categoryColorInput">
            Kategorienfarbe
        </label>


        <input
            id="categoryColorInput"
            type="color"
            value="#ffd54f">


        <button onclick="saveCategory()">
            💾 Kategorie speichern
        </button>


        <button onclick="duplicateCategory()">
            📋 Kategorie duplizieren
        </button>


        <button
            class="deleteButton"
            onclick="deleteCategory()">

            🗑️ Kategorie löschen

        </button>



        <!-- =================================================
             BACKUP
        ================================================== -->

        <hr>

        <h3>💾 Backup</h3>


        <p class="backupText">

            Das Backup enthält deine Karten
            und Kategorien.

        </p>


        <button onclick="exportCards()">

            💾 Karten & Kategorien sichern

        </button>


        <button
            onclick="document.getElementById('importFile').click()">

            📥 Backup wiederherstellen

        </button>


        <input
            type="file"
            id="importFile"
            accept=".json,application/json"
            class="hiddenFileInput"
            onchange="importCards(event)">


        <hr>


        <button onclick="restoreDefaultCards()">

            🔄 Standardkarten & Kategorien
            wiederherstellen

        </button>


        <button
            class="deleteButton"
            onclick="deleteAllCards()">

            🗑️ Alle Karten löschen

        </button>


    </div>

</div>


<script src="script.js"></script>

</body>
</html>
