<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🍺 Bierkarten</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h1>🍺 Bierkarten</h1>

    <button
        class="settingsButton"
        onclick="toggleSettings()"
        aria-label="Einstellungen">
        ⚙️
    </button>

</header>


<main>

    <div id="deck" class="deck">
        <div class="deckCard deckBack">🍺</div>
        <div class="deckCard deckMiddle"></div>
        <div class="deckCard deckTop">🍺</div>
    </div>


    <div id="deckInfo" class="deckInfo">
        0 Karten
    </div>


    <button id="drawButton" class="drawButton">
        Karte ziehen
    </button>


    <!-- Kategorien -->

    <div class="categoryFilter">

        <label for="categoryFilter">
            Kategorie:
        </label>

        <select id="categoryFilter">
            <option value="Alle">Alle Kategorien</option>
        </select>

    </div>


    <!-- Gezogene Karte -->

    <div id="cardContainer"></div>

</main>


<!-- ==========================================
     EINSTELLUNGEN
========================================== -->

<div
    id="settingsOverlay"
    class="overlay"
    onclick="closeSettingsOnOverlay(event)">

    <div
        class="settingsWindow"
        onclick="event.stopPropagation()">


        <div class="settingsHeader">

            <h2>⚙️ Einstellungen</h2>

            <button
                class="closeButton"
                onclick="toggleSettings()">
                ✖
            </button>

        </div>


        <hr>


        <!-- ==========================================
             SUCHE
        =========================================== -->

        <h3>🔎 Karten suchen</h3>

        <input
            id="searchInput"
            class="searchInput"
            type="search"
            placeholder="Karte suchen..."
            oninput="refreshCardList()">


        <hr>


        <!-- ==========================================
             KARTEN
        =========================================== -->

        <h3>📄 Karten</h3>

        <select id="cardSelect"></select>


        <button onclick="loadSelectedCard()">
            📄 Karte laden
        </button>


        <button onclick="newCard()">
            ➕ Neue Karte
        </button>


        <button onclick="duplicateCard()">
            📋 Karte duplizieren
        </button>


        <hr>


        <!-- ==========================================
             KARTE BEARBEITEN
        =========================================== -->

        <label for="titleInput">
            Titel
        </label>

        <input
            id="titleInput"
            type="text"
            placeholder="Kartentitel">


        <label for="textInput">
            Kartentext
        </label>

        <textarea
            id="textInput"
            rows="6"
            placeholder="Kartentext eingeben..."></textarea>


        <small class="hint">
            Zufallszahlen:
            <b>{1-9}</b>,
            <b>{5-20}</b>,
            <b>{100-500}</b>
        </small>


        <!-- Kategorie -->

        <label for="categoryInput">
            Kategorie
        </label>

        <select id="categoryInput">

            <option value="Allgemein">
                Allgemein
            </option>

            <option value="Trinken">
                🍺 Trinken
            </option>

            <option value="Aufgabe">
                🎯 Aufgabe
            </option>

            <option value="Alle">
                👥 Alle
            </option>

            <option value="Spezial">
                🔥 Spezial
            </option>

            <option value="Lustig">
                😂 Lustig
            </option>

        </select>


        <!-- Farbe -->

        <label for="colorInput">
            Farbe
        </label>

        <input
            id="colorInput"
            type="color"
            value="#ffffff">


        <button onclick="saveCard()">
            💾 Speichern
        </button>


        <button onclick="duplicateCard()">
            📋 Karte duplizieren
        </button>


        <button
            class="deleteButton"
            onclick="deleteCard()">
            🗑️ Löschen
        </button>


        <hr>


        <!-- ==========================================
             BACKUP
        =========================================== -->

        <h3>💾 Backup</h3>

        <button onclick="exportCards()">
            💾 Karten sichern
        </button>


        <button
            onclick="document.getElementById('importFile').click()">

            📥 Karten wiederherstellen

        </button>


        <input
            type="file"
            id="importFile"
            accept=".json,application/json"
            class="hiddenFileInput"
            onchange="importCards(event)">


        <button onclick="restoreDefaultCards()">
            🔄 Standardkarten wiederherstellen
        </button>


        <button
            class="deleteButton"
            onclick="deleteAllCards()">

            🗑️ Alle Karten löschen

        </button>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
